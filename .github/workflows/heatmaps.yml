name: YouTube Heatmaps

on:
  workflow_dispatch:
  schedule:
    - cron: '47 10 * * *'

permissions:
  contents: write

concurrency:
  group: youtube-heatmaps
  cancel-in-progress: false

jobs:
  heatmaps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[heatmap]"
          python -m pip install -r requirements.txt

      - name: Compile
        run: python -m compileall src tests

      - name: Run tests
        run: pytest -q

      - name: Extract public heatmaps
        run: python -m ytb_history.cli extract-heatmaps --data-dir data --limit 50

      - name: Build operations telemetry
        run: python -m ytb_history.cli build-operations

      - name: Commit and push heatmap changes
        run: |
          git config user.name "youtube-tracker-bot"
          git config user.email "youtube-tracker-bot@users.noreply.github.com"
          git add data/heatmaps/ data/transcripts/ data/operations/ config/operations.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update YouTube heatmap metadata $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
